name: Monitor & Deploy

on:
  schedule:
    # 每6小时运行一次（UTC时间）
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'monitor.py'
      - 'export_cms.py'
      - 'requirements.txt'
      - 'docs/data/sources.json'
      - 'docs/cms/**'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "monitor-deploy"
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml pypinyin

      - name: Run monitor script
        run: |
          python monitor.py

      - name: Export CMS collection formats
        run: |
          python export_cms.py

      - name: Clean old history files
        run: |
          cd docs/data
          ls -t monitor_*.json 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "📊 Update monitor data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      # 刚上传的 artifact 有时还没进 artifacts 列表，deploy-pages 会报
      # "Found 0 artifact(s)"。这里等一下让它可查。
      - name: Wait for artifact to become listable
        run: sleep 30

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
